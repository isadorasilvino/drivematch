<main class="login-page">
    <section class="login-hero">
        <div class="login-hero__content">
            <img
                class="brand-mark"
                src="/brand/drivematch-symbol-dark.png"
                alt=""
                aria-hidden="true"
            />

            <p class="login-hero__eyebrow">
                DriveMatch
            </p>

            <h1>
                Sua jornada começa aqui.
            </h1>

            <p>
                Encontre instrutores, organize suas aulas e acompanhe sua evolução
                de um jeito simples.
            </p>
        </div>
    </section>

    <section class="login-content">
        <div class="login-card dm-card">
            <header class="login-header">
                <div class="mobile-brand">
                    <img
                        class="brand-mark"
                        src="/brand/drivematch-symbol-light.png"
                        alt=""
                        aria-hidden="true"
                    />

                    <strong>DriveMatch</strong>
                </div>

                <h2>Bem-vindo de volta</h2>

                <p>
                    Entre na sua conta para continuar.
                </p>
            </header>

            <form (ngSubmit)="login()">
                <div class="dm-field">
                    <label class="dm-label" for="email">
                        E-mail
                    </label>

                    <input
                        id="email"
                        class="dm-input"
                        type="email"
                        name="email"
                        [(ngModel)]="email"
                        autocomplete="email"
                        placeholder="seu@email.com"
                        required
                    />
                </div>

                <div class="dm-field">
                    <label class="dm-label" for="password">
                        Senha
                    </label>

                    <input
                        id="password"
                        class="dm-input"
                        type="password"
                        name="password"
                        [(ngModel)]="password"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        required
                    />
                </div>

                @if (errorMessage()) {
                    <div class="login-error" role="alert">
                        {{ errorMessage() }}
                    </div>
                }

                <button
                    class="dm-button dm-button--primary dm-button--full"
                    type="submit"
                    [disabled]="isLoading()"
                >
                    {{ isLoading() ? 'Entrando...' : 'Entrar' }}
                </button>
            </form>
        </div>
    </section>
</main>
