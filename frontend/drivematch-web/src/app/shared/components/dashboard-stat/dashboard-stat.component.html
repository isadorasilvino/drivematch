<article class="dashboard-stat">
    <div class="dashboard-stat__icon">
        <fa-icon [icon]="icon" aria-hidden="true">
        </fa-icon>
    </div>

    <div class="dashboard-stat__content">
        <strong class="dashboard-stat__value">
            {{ value }}
        </strong>

        <span class="dashboard-stat__label">
            {{ label }}
        </span>
    </div>
</article>
