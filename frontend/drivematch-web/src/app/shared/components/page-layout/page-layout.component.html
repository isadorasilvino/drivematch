<main class="page-layout">
    @if (showHeader()) {
        <header class="page-layout__header">
            <span class="page-layout__eyebrow">
                {{ eyebrow() }}
            </span>

            <h1>{{ title() }}</h1>

            @if (description()) {
                <p>{{ description() }}</p>
            }
        </header>
    }

    <div class="page-layout__content">
        <ng-content />
    </div>
</main>
