<app-section title="Segurança" description="Atualize sua senha de acesso ao DriveMatch." [divided]="true">
    <div class="password-form">
        <div class="field">
            <label for="current-password">Senha atual</label>

            <div class="password-input">
                <input id="current-password" [type]="showCurrentPassword() ? 'text' : 'password'" name="currentPassword"
                    [(ngModel)]="currentPassword" autocomplete="current-password" placeholder="Digite sua senha atual"
                    [disabled]="isSaving()" />

                <button type="button" class="password-toggle" (click)="toggleCurrentPassword()" [attr.aria-label]="
            showCurrentPassword()
              ? 'Ocultar senha atual'
              : 'Mostrar senha atual'
          ">
                    {{ showCurrentPassword() ? 'Ocultar' : 'Mostrar' }}
                </button>
            </div>
        </div>

        <div class="password-row">
            <div class="field">
                <label for="new-password">Nova senha</label>

                <div class="password-input">
                    <input id="new-password" [type]="showNewPassword() ? 'text' : 'password'" name="newPassword"
                        [(ngModel)]="newPassword" autocomplete="new-password" placeholder="Digite sua nova senha"
                        [disabled]="isSaving()" />

                    <button type="button" class="password-toggle" (click)="toggleNewPassword()" [attr.aria-label]="
              showNewPassword()
                ? 'Ocultar nova senha'
                : 'Mostrar nova senha'
            ">
                        {{ showNewPassword() ? 'Ocultar' : 'Mostrar' }}
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirm-password">
                    Confirmar nova senha
                </label>

                <div class="password-input">
                    <input id="confirm-password" [type]="showConfirmPassword() ? 'text' : 'password'"
                        name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password"
                        placeholder="Digite novamente" [disabled]="isSaving()" />

                    <button type="button" class="password-toggle" (click)="toggleConfirmPassword()" [attr.aria-label]="
              showConfirmPassword()
                ? 'Ocultar confirmação da senha'
                : 'Mostrar confirmação da senha'
            ">
                        {{ showConfirmPassword() ? 'Ocultar' : 'Mostrar' }}
                    </button>
                </div>
            </div>
        </div>

        @if (errorMessage()) {
        <p class="message message--error">
            {{ errorMessage() }}
        </p>
        }

        @if (successMessage()) {
        <p class="message message--success">
            {{ successMessage() }}
        </p>
        }

        <div class="actions">
            <button type="button" class="change-password-button" [disabled]="isSaving()" (click)="changePassword()">
                {{ isSaving() ? 'Alterando...' : 'Alterar senha' }}
            </button>
        </div>
    </div>
</app-section>
